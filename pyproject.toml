[project]
name = "sap-mcp"
version = "0.7.7"
description = "Read-only MCP server for SAP S/4HANA OData (CA/Finance workflows)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "keyring>=24.0.0",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
sap-mcp = "sap_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
sap_mcp = ["assets/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
